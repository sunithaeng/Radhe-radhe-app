
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radhe Radhe - Sunitha</title>
<style>
body{background:#ffc8dd; margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center; font-family:Arial;}
.card{background:white; width:90%; max-width:330px; border-radius:25px; padding:25px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.2);}
h1{color:#e91e63; font-size:32px; margin:10px;}
.btn{background:#e91e63; color:white; border:none; padding:14px; border-radius:25px; width:95%; font-size:18px; margin:8px 0; cursor:pointer;}
.btn2{background:#ff4081;}
</style>
</head>
<body>
<div class="card">
<h1>🦚 Radhe Radhe 🙏</h1>
<h3>Sunitha 💖</h3>
<h2 id="likeText">💖 106 Likes 💖</h2>
<button class="btn" onclick="like()">💖 Like Cheyandi</button>
<button class="btn btn2" onclick="playSong()">🎵 Play Bhajan</button>
<p style="color:green;">🎵 Radhe Radhe Govinda... 🎶</p>
<p id="msg" style="color:#e91e63; font-weight:bold;"></p>
<p style="font-size:12px; color:gray;">Your Bhajan will play on YouTube 🙏</p>
</div>
<script>
let c=106;
function like(){c++; document.getElementById('likeText').innerText='💖 '+c+' Likes 💖'; document.getElementById('msg').innerText='Thank you Akka! 💖';}
function playSong(){
document.getElementById('msg').innerText='🎶 Opening YouTube... 🙏';
window.open('https://www.youtube.com/results?search_query=Radhe+Radhe+bhajan','_blank');
}
</script>
</body>
</html>
